<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEVI // LEVEL 20</title><style>
:root{--g:#62ff8a;--bg:#050807;--dim:#86a58e;--bad:#ff6464}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#102015,#050807 55%);color:var(--g);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh;display:grid;place-items:center;padding:18px}.term{width:min(760px,100%);border:1px solid #285c35;border-radius:14px;background:#020403eF;box-shadow:0 0 50px #0f3a1b88;overflow:hidden}.bar{padding:10px 14px;border-bottom:1px solid #173c22;color:#9fb6a5;font-size:12px}.screen{padding:24px;min-height:520px}.muted{color:var(--dim)}h1{font-size:clamp(26px,6vw,46px);margin:8px 0}.blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}button,input{font:inherit}button{background:#0b2713;color:var(--g);border:1px solid #39a854;border-radius:8px;padding:12px 16px;cursor:pointer;margin-top:12px}button:hover{background:#12371d}input{width:100%;background:#061008;color:var(--g);border:1px solid #285c35;border-radius:8px;padding:12px;margin-top:10px;outline:none}.err{color:var(--bad);min-height:22px}.ok{font-weight:700}.money{font-size:clamp(54px,14vw,100px);font-weight:900;text-shadow:0 0 24px #39ff6a;margin:20px 0}.progress{height:10px;background:#0a160d;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:var(--g);transition:width 1.6s}.code{white-space:pre-wrap;background:#071009;border-left:3px solid #2a6e3a;padding:14px;color:#b8ffc8}.hidden{display:none}.center{text-align:center}.small{font-size:13px}.heart{font-family:system-ui,sans-serif}</style></head><body><main class="term"><div class="bar">birthday-terminal — secure session — levi@level20:~</div><section class="screen" id="app"></section></main><script>
const app=document.querySelector('#app');let step=0;
function shell(title,body,button='START SYSTEM'){app.innerHTML=`<div class="muted">&gt; ${title}</div>${body}${button?`<button onclick="next()">${button}</button>`:''}`}
function next(){step++;render()}
function check(expected){const v=document.querySelector('#ans').value.trim().toUpperCase();if(v===expected){step++;render()}else document.querySelector('#err').textContent='ACCESS DENIED — incorrect input. Try again.'}
function render(){if(step===0)shell('incoming update detected',`<h1>LEVI // LEVEL 20<span class="blink">_</span></h1><p>A birthday update is available.</p><p class="muted">Current version: 19.9<br>Target version: 20.0<br>User type: SOFTWARE DEVELOPER</p>`);
else if(step===1){app.innerHTML=`<div>&gt; installing birthday.exe...</div><div class="progress"><div class="fill" id="f"></div></div><p id="p">0%</p>`;setTimeout(()=>{f.style.width='100%';p.textContent='100% — VERSION 20.0 INSTALLED ✓';setTimeout(()=>{step++;render()},900)},100)}
else if(step===2)q('SECURITY CHECK 1/3','Decode this binary value:','01001100 01000101 01010110 01001001','LEVI','Enter decoded value');
else if(step===3)q('SECURITY CHECK 2/3','The birthday funds refuse to deploy. Find the value that fixes the bug:',`let age = 19;\n\nif (age === 20) {\n   releaseBirthdayMoney();\n}`,'20','Enter correct value');
else if(step===4)q('SECURITY CHECK 3/3','Final authorization. Calculate the access code:',`2² × 5² = ?`,'100','Enter access code');
else finale()}
function q(head,text,code,answer,ph){app.innerHTML=`<div class="muted">&gt; ${head}</div><h1>${head}</h1><p>${text}</p><div class="code">${code}</div><input id="ans" placeholder="${ph}" autocomplete="off"><div id="err" class="err"></div><button onclick="check('${answer}')">EXECUTE</button><p class="small muted">Hint: developers are allowed to debug.</p>`;document.querySelector('#ans').addEventListener('keydown',e=>{if(e.key==='Enter')check(answer)})}
function finale(){app.innerHTML=`<div class="center"><div class="muted">&gt; ALL SECURITY CHECKS PASSED ✓<br>&gt; ACCESS LEVEL: 20<br>&gt; AUTHORIZATION: GRANTED</div><h1>BIRTHDAY BONUS FOUND</h1><p>Decrypting...</p><div class="progress"><div class="fill" id="f"></div></div><div id="reveal" class="hidden"><div class="money">€200</div><p class="ok">BIRTHDAY FUNDS UNLOCKED ✓</p><p>Gefeliciteerd Levi!</p><p><strong>LEVEL 20 successfully activated.</strong></p><p>20 jaar oud.<br>Software Developer.<br>En €200 rijker. ✓</p><p>Besteed het verstandig...</p><p>...of niet. Je bent nu 20.</p><p class="heart">Heel veel liefs,<br><strong>papa &amp; mama ♥</strong></p></div></div>`;setTimeout(()=>{f.style.width='100%';setTimeout(()=>reveal.classList.remove('hidden'),1700)},100)}render();
</script></body></html>
